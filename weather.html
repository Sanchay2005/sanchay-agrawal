<title>Weather Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: search bar on top, one large current-conditions panel, a five-day strip, then a row of detail readings. */
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --fg: #121821;
    --muted: #5a6575;
    --line: #dfe4ec;
    --accent: #1f5fd1;
    --accent-soft: #e6eefc;
    --warn: #a15c00;
    --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131a; --surface: #151c26; --fg: #eaeef5; --muted: #98a3b3;
      --line: #263040; --accent: #6ea2ff; --accent-soft: #172641; --warn: #f0b45a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131a; --surface: #151c26; --fg: #eaeef5; --muted: #98a3b3;
    --line: #263040; --accent: #6ea2ff; --accent-soft: #172641; --warn: #f0b45a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.55;
    padding-block: 1.5rem 3rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 1.25rem; }
  h1 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
  form { display: flex; gap: 0.5rem; flex: 1 1 320px; max-width: 480px; }
  input[type="text"] {
    flex: 1; min-width: 0; font: inherit; padding: 0.6rem 0.85rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
  }
  button {
    font: inherit; font-weight: 500; padding: 0.6rem 1.1rem; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    padding: 0.3rem 0.8rem; font-size: 0.85rem; border-radius: 999px;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .badge { font-size: 0.78rem; padding: 0.2rem 0.65rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.live { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .note { font-size: 0.85rem; color: var(--warn); margin: 0; min-height: 1.3em; }

  .now {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.75rem; display: grid; gap: 0.25rem;
  }
  .place { color: var(--muted); font-size: 0.95rem; }
  .temp { font-family: var(--font-display); font-weight: 700; font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; letter-spacing: -0.04em; }
  .temp small { font-size: 0.4em; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .cond { font-size: 1.15rem; font-weight: 500; }
  .feels { color: var(--muted); font-size: 0.9rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; }
  .stat .label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stat .value { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  h2 { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0.5rem 0 0; font-weight: 600; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: 0.2rem; }
  .day .name { font-weight: 600; }
  .day .desc { color: var(--muted); font-size: 0.85rem; }
  .day .range { font-variant-numeric: tabular-nums; margin-top: 0.4rem; font-weight: 500; }
  .day .range span { color: var(--muted); font-weight: 400; }
  .day .rain { font-size: 0.82rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .src { color: var(--muted); font-size: 0.8rem; margin: 0; }
</style>

<div class="wrap">
  <div class="bar">
    <h1>Weather Dashboard</h1>
    <span class="badge" id="mode">Sample data</span>
  </div>

  <form id="search" autocomplete="off">
    <input type="text" id="city" name="city" placeholder="Search a city, e.g. Pune" aria-label="City name">
    <button type="submit">Search</button>
  </form>
  <div class="chips" id="chips" role="group" aria-label="Quick cities"></div>
  <p class="note" id="note" role="status"></p>

  <section class="now" aria-live="polite">
    <div class="place" id="place"></div>
    <div class="temp"><span id="temp"></span><small>&deg;C</small></div>
    <div class="cond" id="cond"></div>
    <div class="feels" id="feels"></div>
  </section>

  <div class="stats">
    <div class="stat"><div class="label">Humidity</div><div class="value" id="hum"></div></div>
    <div class="stat"><div class="label">Wind</div><div class="value" id="wind"></div></div>
    <div class="stat"><div class="label">Rain today</div><div class="value" id="rain"></div></div>
  </div>

  <h2>Next 5 days</h2>
  <div class="days" id="days"></div>

  <p class="src" id="src"></p>
</div>

<script>
  // Sample data is used when the live weather service can't be reached (for example inside this preview).
  var SAMPLE = {
    "Pune":   { place: "Pune, India",   t: 27, feels: 28, code: 2, hum: 58, wind: 11, days: [[2,31,19,10],[1,32,19,5],[3,30,20,35],[61,28,20,70],[2,30,19,20]] },
    "Mumbai": { place: "Mumbai, India", t: 31, feels: 35, code: 1, hum: 72, wind: 16, days: [[1,33,26,5],[2,33,26,10],[61,31,25,55],[63,30,25,80],[2,32,26,15]] },
    "Delhi":  { place: "Delhi, India",  t: 24, feels: 23, code: 45, hum: 61, wind: 8, days: [[45,26,12,0],[1,27,12,0],[1,28,13,0],[2,27,13,5],[3,26,14,10]] },
    "London": { place: "London, United Kingdom", t: 9, feels: 6, code: 3, hum: 83, wind: 19, days: [[3,10,5,30],[61,9,5,65],[61,8,4,70],[2,10,4,20],[1,11,5,10]] }
  };
  var CODES = {0:"Clear sky",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Heavy showers",82:"Violent showers",95:"Thunderstorm",96:"Thunderstorm with hail",99:"Severe thunderstorm"};
  function describe(c) { return CODES[c] || "Mixed conditions"; }

  var el = function (id) { return document.getElementById(id); };
  var chipsEl = el("chips");

  Object.keys(SAMPLE).forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { el("city").value = name; run(name); });
    chipsEl.appendChild(b);
  });

  function markChip(name) {
    Array.prototype.forEach.call(chipsEl.children, function (c) {
      c.setAttribute("aria-pressed", c.textContent.toLowerCase() === String(name).toLowerCase() ? "true" : "false");
    });
  }

  function dayLabel(offset) {
    if (offset === 0) return "Today";
    var d = new Date(); d.setDate(d.getDate() + offset);
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
  }

  function render(data, live) {
    el("place").textContent = data.place;
    el("temp").textContent = Math.round(data.t);
    el("cond").textContent = describe(data.code);
    el("feels").textContent = "Feels like " + Math.round(data.feels) + "°C";
    el("hum").textContent = Math.round(data.hum) + "%";
    el("wind").textContent = Math.round(data.wind) + " km/h";
    el("rain").textContent = Math.round(data.days[0][3]) + "%";
    var box = el("days"); box.innerHTML = "";
    data.days.forEach(function (d, i) {
      var div = document.createElement("div"); div.className = "day";
      div.innerHTML = '<div class="name"></div><div class="desc"></div><div class="range"></div><div class="rain"></div>';
      div.children[0].textContent = dayLabel(i);
      div.children[1].textContent = describe(d[0]);
      div.children[2].innerHTML = Math.round(d[1]) + "&deg; <span>/ " + Math.round(d[2]) + "&deg;</span>";
      div.children[3].textContent = Math.round(d[3]) + "% rain";
      box.appendChild(div);
    });
    var m = el("mode");
    m.textContent = live ? "Live data" : "Sample data";
    m.className = live ? "badge live" : "badge";
    el("src").textContent = live ? "Live forecast from Open-Meteo." : "Showing built-in sample readings, not a current forecast.";
  }

  function fetchJSON(url) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 6000);
    return fetch(url, { signal: ctrl.signal }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function live(query) {
    var geo = "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(query);
    return fetchJSON(geo).then(function (g) {
      if (!g.results || !g.results.length) { var e = new Error("notfound"); e.notfound = true; throw e; }
      var p = g.results[0];
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5";
      return fetchJSON(url).then(function (f) {
        var days = f.daily.time.map(function (_, i) {
          return [f.daily.weather_code[i], f.daily.temperature_2m_max[i], f.daily.temperature_2m_min[i], f.daily.precipitation_probability_max[i] || 0];
        });
        return {
          place: p.name + (p.country ? ", " + p.country : ""),
          t: f.current.temperature_2m, feels: f.current.apparent_temperature, code: f.current.weather_code,
          hum: f.current.relative_humidity_2m, wind: f.current.wind_speed_10m, days: days
        };
      });
    });
  }

  function findSample(q) {
    var key = Object.keys(SAMPLE).filter(function (k) { return k.toLowerCase() === q.toLowerCase(); })[0];
    return key ? SAMPLE[key] : null;
  }

  function run(q) {
    q = (q || "").trim();
    if (!q) { el("note").textContent = "Type a city name to search."; return; }
    el("note").textContent = "Loading...";
    markChip(q);
    live(q).then(function (data) {
      el("note").textContent = "";
      render(data, true);
    }).catch(function (err) {
      var s = findSample(q);
      if (err && err.notfound) {
        el("note").textContent = "No city found for “" + q + "”. Check the spelling and try again.";
      } else if (s) {
        el("note").textContent = "Live service not reachable here, so this shows sample readings.";
        render(s, false);
      } else {
        el("note").textContent = "Live search is unavailable in this preview. Try Pune, Mumbai, Delhi or London for sample readings.";
      }
    });
  }

  el("search").addEventListener("submit", function (e) { e.preventDefault(); run(el("city").value); });

  render(SAMPLE["Pune"], false);
  el("city").value = "Pune";
  markChip("Pune");
  run("Pune");
</script>
